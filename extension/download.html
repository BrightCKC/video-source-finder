<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>下載 HLS 影片</title>
  <link rel="stylesheet" href="popup.css">
  <script src="download.js" type="module"></script>
</head>
<body class="download-page">
  <header>
    <h1>下載 HLS 影片</h1>
  </header>
  <main>
    <p id="status" role="status">正在準備下載。</p>
    <progress id="progress" max="1" aria-label="下載進度" hidden></progress>
    <p>
      <button id="save" class="download" type="button" disabled>選擇儲存位置</button>
      <button id="allow" type="button" hidden>允許影片來源</button>
      <button id="cancel" type="button" hidden>取消下載</button>
    </p>
  </main>
</body>
</html>
