<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Source Finder</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" type="module"></script>
</head>
<body>
  <header>
    <div class="header-row">
      <div>
        <h1 data-message="appName">Video Source Finder</h1>
        <p id="count" aria-live="polite">Reading the current tab…</p>
      </div>
      <button id="rescan" type="button" data-message="rescan" disabled>Rescan</button>
    </div>
    <label class="language-option">
      <span data-message="languageLabel">Language</span>
      <select id="language" disabled>
        <option value="en" lang="en">English</option>
        <option value="zh-TW" lang="zh-Hant">繁體中文</option>
      </select>
    </label>
  </header>
  <main>
    <p id="notice" role="status" hidden></p>
    <ol id="sources" aria-label="Video sources"></ol>
    <p id="empty" data-message="noSources" hidden>No video sources found. If a video loads only when played, start playback and check the list again.</p>
  </main>
</body>
</html>
